name: Kali Linux Official XFCE RDP

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  kali-rdp:
    runs-on: ubuntu-latest
    timeout-minutes: 360

    steps:
      - name: 1. Checkout Repository
        uses: actions/checkout@v4

      - name: 2. Hubungkan Tailscale di Host
        run: |
          echo "=== Memasang Tailscale ==="
          curl -fsSL https://tailscale.com/install.sh | sudo sh
          sudo tailscale up --authkey=${{ secrets.TAILSCALE_AUTH_KEY }} --hostname=kali-runner-${{ github.run_id }} --accept-routes
          
          TS_IP=""
          for i in {1..20}; do
            TS_IP=$(tailscale ip -4 2>/dev/null || true)
            if [ -n "$TS_IP" ]; then break; fi
            sleep 2
          done
          
          if [ -z "$TS_IP" ]; then
            echo "::error::Gagal mendapatkan IP Tailscale" && exit 1
          fi
          echo "TAILSCALE_IP=$TS_IP" >> $GITHUB_ENV
          echo "Tailscale IP Aktif: $TS_IP"

      - name: 3. Bangun & Jalankan Kali Linux Native XRDP (Full UI, Wallpaper, Panel & Ikon)
        run: |
          cat <<'EOF' > entrypoint.sh
          #!/bin/bash
          set -e

          mkdir -p /var/run/dbus /var/run/xrdp /tmp/.X11-unix
          chmod 1777 /tmp/.X11-unix
          dbus-uuidgen --ensure=/etc/machine-id 2>/dev/null || true
          service dbus start || true

          # Unduh wallpaper resmi Kali Linux 2025 berkualitas tinggi
          mkdir -p /usr/share/backgrounds/kali
          curl -fsSL "https://www.kali.org/wallpapers/images/2025/kali-oleo.png" -o /usr/share/backgrounds/kali/kali-wallpaper.png 2>/dev/null || true

          touch /var/log/xrdp.log /var/log/xrdp-sesman.log
          chmod 666 /var/log/xrdp.log /var/log/xrdp-sesman.log

          echo "Memulai xrdp-sesman & xrdp daemon..."
          /etc/init.d/xrdp start

          for i in {1..20}; do
            if netstat -tlpn 2>/dev/null | grep -q ":3389"; then
              echo "xrdp port 3389 BERHASIL LISTENING!"
              break
            fi
            sleep 1
          done

          echo "=== Kali Linux Desktop RDP Siap Digunakan ==="
          exec tail -f /var/log/xrdp.log /var/log/xrdp-sesman.log
          EOF
          chmod +x entrypoint.sh

          # Script startwm.sh yang bertanggung jawab meluncurkan SELURUH antarmuka GUI saat login RDP
          cat <<'EOF' > startwm.sh
          #!/bin/bash
          export DISPLAY=$DISPLAY
          export XDG_CURRENT_DESKTOP=XFCE
          export DESKTOP_SESSION=xfce
          export LIBGL_ALWAYS_SOFTWARE=1
          export GDK_BACKEND=x11
          export GTK_THEME=Kali-Dark
          export QT_QPA_PLATFORMTHEME=gtk2

          # Siapkan runtime dir & D-Bus session
          export XDG_RUNTIME_DIR="/tmp/runtime-$USER"
          mkdir -p "$XDG_RUNTIME_DIR"
          chmod 700 "$XDG_RUNTIME_DIR"

          if [ -z "$DBUS_SESSION_BUS_ADDRESS" ]; then
            eval $(dbus-launch --sh-syntax)
          fi

          # Matikan blanking layar & DPMS
          xset s off 2>/dev/null || true
          xset -dpms 2>/dev/null || true
          xset s noblank 2>/dev/null || true

          # Path wallpaper resmi
          WP="/usr/share/backgrounds/kali/kali-wallpaper.png"
          if [ ! -s "$WP" ]; then
            WP=$(find /usr/share/backgrounds -type f \( -name "*.png" -o -name "*.jpg" \) 2>/dev/null | grep -i kali | head -n 1)
          fi

          # Warnai background terlebih dahulu agar tidak hitam pekat
          xsetroot -solid "#1e1e2e" 2>/dev/null || true

          # Terapkan Tema Gelap Kali & Icon Theme
          xfconf-query -c xsettings -p /Net/ThemeName -s "Kali-Dark" --create -t string 2>/dev/null || true
          xfconf-query -c xsettings -p /Net/IconThemeName -s "Flat-Remix-Blue-Dark" --create -t string 2>/dev/null || true
          xfconf-query -c xsettings -p /Net/IconThemeName -s "Papirus-Dark" --create -t string 2>/dev/null || true
          xfconf-query -c xfwm4 -p /general/theme -s "Kali-Dark" --create -t string 2>/dev/null || true
          xfconf-query -c xfwm4 -p /general/use_compositing -s false --create -t bool 2>/dev/null || true

          # Terapkan Wallpaper ke semua monitor yang dideteksi XFCE
          for m in monitor0 monitorrdp0 monitorX11-0 monitordefault; do
            xfconf-query -c xfce4-desktop -p "/backdrop/screen0/$m/workspace0/color-style" -s 0 --create -t int 2>/dev/null || true
            xfconf-query -c xfce4-desktop -p "/backdrop/screen0/$m/workspace0/image-style" -s 5 --create -t int 2>/dev/null || true
            xfconf-query -c xfce4-desktop -p "/backdrop/screen0/$m/workspace0/last-image" -s "$WP" --create -t string 2>/dev/null || true
          done

          # Jalankan Settings Daemon (WAJIB agar tema dan ikon terbaca)
          xfsettingsd --replace &
          sleep 1

          # Jalankan Window Manager (WAJIB agar ada titlebar & jendela bisa digeser)
          xfwm4 --compositor=off --replace &
          sleep 1

          # Jalankan Panel Atas (Menu Naga Whisker + Taskbar + Jam)
          if [ ! -f "$HOME/.config/xfce4/xfconf/xfce-perchannel-xml/xfce4-panel.xml" ]; then
            mkdir -p "$HOME/.config/xfce4/xfconf/xfce-perchannel-xml"
            cp /etc/xdg/xfce4/panel/default.xml "$HOME/.config/xfce4/xfconf/xfce-perchannel-xml/xfce4-panel.xml" 2>/dev/null || true
          fi
          xfce4-panel --disable-wm-check &
          sleep 1

          # Jalankan Desktop Manager (Ikon Desktop & Wallpaper)
          xfdesktop --disable-wm-check &

          # Background Loop Supervisor: Pantau terus agar GUI tidak hilang
          while true; do
            sleep 4
            if ! pgrep -x "xfwm4" >/dev/null 2>&1; then
              xfwm4 --compositor=off --replace &
            fi
            if ! pgrep -x "xfce4-panel" >/dev/null 2>&1; then
              xfce4-panel --disable-wm-check &
            fi
            if ! pgrep -x "xfdesktop" >/dev/null 2>&1; then
              xfdesktop --disable-wm-check &
            fi
          done
          EOF
          chmod +x startwm.sh

          cat <<'EOF' > Dockerfile
          FROM kalilinux/kali-rolling:latest

          ENV DEBIAN_FRONTEND=noninteractive

          # Pasang XFCE, Tooling, SVG Renderers, Icon Themes, xorg & xrdp
          RUN apt-get update && \
              apt-get install -y \
                kali-desktop-xfce \
                kali-wallpapers-all \
                kali-themes \
                kali-defaults \
                librsvg2-common \
                librsvg2-bin \
                papirus-icon-theme \
                adwaita-icon-theme \
                xorg \
                xrdp \
                xorgxrdp \
                dbus-x11 \
                curl \
                wget \
                sudo \
                fastfetch \
                net-tools \
                iproute2 \
                ca-certificates \
                fonts-dejavu-core \
                fonts-noto-core \
                nmap \
                firefox-esr \
                nodejs \
                npm && \
              chmod -x /usr/bin/xfce4-screensaver /usr/bin/light-locker /usr/bin/xscreensaver /usr/bin/xfce4-power-manager 2>/dev/null || true && \
              apt-get clean && \
              rm -rf /var/lib/apt/lists/*

          # Buat user kali dengan hak sudo penuh
          RUN useradd -m -s /bin/bash -u 1000 kali && \
              echo "kali:pochi@333" | chpasswd && \
              echo "kali ALL=(ALL) ALL" >> /etc/sudoers && \
              adduser kali ssl-cert

          # Pasang startwm.sh & link ke .xsession
          COPY startwm.sh /etc/xrdp/startwm.sh
          RUN chmod +x /etc/xrdp/startwm.sh && \
              ln -sf /etc/xrdp/startwm.sh /home/kali/.xsession && \
              chown kali:kali /home/kali/.xsession

          # Pasang OpenCode CLI & 9Router
          RUN curl -fsSL https://github.com/anomalyco/opencode/releases/latest/download/opencode-linux-x64.tar.gz | tar -xz -C /usr/local/bin && \
              chmod +x /usr/local/bin/opencode && \
              npm install -g 9router

          # Buat Desktop Shortcuts dengan Icon Resmi
          RUN mkdir -p /home/kali/Desktop && \
              echo '[Desktop Entry]\nVersion=1.0\nType=Application\nName=OpenCode Agent\nComment=Terminal AI Coding Agent\nExec=xfce4-terminal -T "OpenCode AI Agent" -e "opencode"\nIcon=utilities-terminal\nTerminal=false\nCategories=Development;' > /home/kali/Desktop/OpenCode.desktop && \
              echo '[Desktop Entry]\nVersion=1.0\nType=Application\nName=9Router Gateway\nComment=AI Gateway for LLMs\nExec=xfce4-terminal -T "9Router Gateway" -e "9router"\nIcon=network-wired\nTerminal=false\nCategories=Network;' > /home/kali/Desktop/9Router.desktop && \
              echo '[Desktop Entry]\nVersion=1.0\nType=Application\nName=Kali Terminal\nExec=xfce4-terminal\nIcon=org.xfce.terminal\nTerminal=false;' > /home/kali/Desktop/Terminal.desktop && \
              echo '[Desktop Entry]\nVersion=1.0\nType=Application\nName=Firefox ESR\nExec=firefox-esr\nIcon=firefox-esr\nTerminal=false;' > /home/kali/Desktop/Firefox.desktop && \
              chmod +x /home/kali/Desktop/*.desktop && \
              mkdir -p /home/kali/.config/opencode && \
              chmod -R 777 /home/kali/.config && \
              chown -R kali:kali /home/kali

          COPY entrypoint.sh /entrypoint.sh
          ENTRYPOINT ["/entrypoint.sh"]
          EOF

          # Hentikan service xrdp host jika ada
          sudo systemctl stop xrdp 2>/dev/null || true

          docker build -t kali-native-rdp .
          # Shared Memory 2GB untuk menjamin buffer grafis tidak pernah crash
          docker run -d --name kali-desktop --net=host --privileged --shm-size 2g kali-native-rdp

          echo "Memverifikasi port 3389..."
          for i in {1..30}; do
            if sudo netstat -tlpn 2>/dev/null | grep -q ":3389"; then
              echo "Port 3389 RDP Kali Linux AKTIF & SIAP!"
              break
            fi
            sleep 1
          done

          docker ps
          docker logs kali-desktop || true

      - name: 4. Lapor IP & Detail Akses Kali ke Repositori
        run: |
          cat << EOF > CURRENT_IP.txt
          ==================================================
                 🐉 KALI LINUX OFFICIAL XFCE RDP AKTIF 🐉
          ==================================================
          IP Tailscale      : $TAILSCALE_IP
          Hostname Tailnet  : kali-runner-${{ github.run_id }}
          Port RDP          : 3389 (mstsc / 0X1 Desktop)
          OS                : Kali Linux Official (Rolling)
          Desktop           : XFCE Official (ORI)
          User              : kali
          Password          : pochi@333
          Driver            : Native xorgxrdp (Supervisor UI Mode)
          --------------------------------------------------
          FITUR SIAP PAKAI:
          ✅ OpenCode CLI (AI Coding Agent)
          ✅ 9Router (AI Gateway Router)
          ✅ Full Kali Wallpaper 2025
          ✅ Full Icon Rendering (librsvg2 + Papirus/Flat-Remix)
          ✅ Official Kali Panel (Whisker Dragon Menu & Taskbar)
          ✅ Window Manager (xfwm4 tanpa OpenGL crash)
          ✅ 2GB Shared Memory (Anti crash saat render)
          --------------------------------------------------
          CARA AKSES:
          1. Buka Remote Desktop Connection (mstsc) atau 0X1 Desktop
          2. Masukkan Computer: $TAILSCALE_IP
          3. Masukkan User    : kali
          4. Masukkan Password: pochi@333
          ==================================================
          EOF

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add CURRENT_IP.txt
          git commit -m "chore: Update Kali Linux Native RDP Info [Run ${{ github.run_id }}]" || true
          git push origin main || true

      - name: 5. Informasi Akses & Loop Aktif (6 Jam)
        run: |
          echo "=========================================="
          echo "    KALI LINUX OFFICIAL XFCE RDP AKTIF    "
          echo "=========================================="
          echo "IP Tailscale  : $TAILSCALE_IP"
          echo "Port RDP      : 3389"
          echo "OS            : Kali Linux Official"
          echo "Desktop       : XFCE Official (ORI)"
          echo "Driver        : Native xorgxrdp"
          echo "User          : kali"
          echo "Password      : pochi@333"
          echo "=========================================="

          while true; do
            echo "[$(date '+%H:%M:%S')] Kali Linux Official XFCE Active..."
            sleep 60
          done
