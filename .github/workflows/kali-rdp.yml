name: Kali Linux Official XFCE RDP

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  kali-rdp:
    runs-on: ubuntu-latest
    timeout-minutes: 360

    steps:
      - name: 1. Checkout Repository
        uses: actions/checkout@v4

      - name: 2. Hubungkan Tailscale & Laporkan IP ke Repositori
        run: |
          curl -fsSL https://tailscale.com/install.sh | sudo sh
          sudo tailscale up --authkey=${{ secrets.TAILSCALE_AUTH_KEY }} --hostname=kali-runner-${{ github.run_id }}
          
          TS_IP=""
          for i in {1..15}; do
            TS_IP=$(tailscale ip -4 2>/dev/null || true)
            if [ -n "$TS_IP" ]; then break; fi
            sleep 2
          done
          
          if [ -z "$TS_IP" ]; then
            echo "Gagal mendapatkan IP Tailscale" && exit 1
          fi
          echo "TAILSCALE_IP=$TS_IP" >> $GITHUB_ENV
          echo "Tailscale IP: $TS_IP"

          # Tulis IP ke CURRENT_IP.txt dan push otomatis ke GitHub
          git config user.name "0X1-Bot"
          git config user.email "bot@0x1.cloud"
          echo "IP Tailscale: $TS_IP" > CURRENT_IP.txt
          echo "Runner: kali-runner-${{ github.run_id }}" >> CURRENT_IP.txt
          echo "Port: 3389" >> CURRENT_IP.txt
          echo "Username: kali" >> CURRENT_IP.txt
          echo "Password: pochi@333" >> CURRENT_IP.txt
          echo "Desktop: XFCE Official (ORI)" >> CURRENT_IP.txt
          git add CURRENT_IP.txt
          git commit -m "Auto-report Kali Linux IP: $TS_IP [skip ci]" || true
          git remote set-url origin "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/kmolitzy/ggggggg.git"
          git push origin main || true

      - name: 3. Pasang & Konfigurasi xrdp Gateway (Pure Auto-Login Tanpa Dialog)
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq xrdp netcat-openbsd

          sudo python3 - <<'PY'
          from pathlib import Path
          import re
          p = Path('/etc/xrdp/xrdp.ini')
          s = p.read_text()
          s = re.sub(r'#?\s*autorun=.*', 'autorun=KaliLinux', s)
          s = re.sub(r'#?\s*hidelogwindow=.*', 'hidelogwindow=yes', s)
          
          vnc_entry = """[KaliLinux]
          name=KaliLinux
          lib=libvnc.so
          ip=127.0.0.1
          port=5901
          username=na
          password=
          """
          s = re.sub(r'\[Xorg\]', vnc_entry + '\n[Xorg]', s)
          p.write_text(s)
          PY

          sudo systemctl restart xrdp

      - name: 4. Bangun & Jalankan Desktop Kali Linux Murni (XFCE Official ORI + OpenCode + 9Router)
        run: |
          cat <<'EOF' > entrypoint.sh
          #!/bin/bash
          set -e

          # 1. Pastikan direktori X11 & D-Bus siap
          mkdir -p /tmp/.X11-unix
          chmod 1777 /tmp/.X11-unix
          dbus-uuidgen --ensure=/etc/machine-id 2>/dev/null || true

          # 2. Buat Shortcut Desktop untuk OpenCode & 9Router
          mkdir -p /home/kali/Desktop

          cat <<'DESK' > /home/kali/Desktop/opencode.desktop
          [Desktop Entry]
          Version=1.0
          Type=Application
          Name=OpenCode AI Agent
          Comment=Terminal-native AI Coding Agent
          Exec=xfce4-terminal --title="OpenCode AI Agent" --command="bash -c 'echo \"=== OpenCode AI Agent ===\"; opencode; exec bash'"
          Icon=utilities-terminal
          Path=/home/kali
          Terminal=false
          Categories=Development;Utility;
          DESK

          cat <<'DESK' > /home/kali/Desktop/9router.desktop
          [Desktop Entry]
          Version=1.0
          Type=Application
          Name=9Router AI Gateway
          Comment=Open-source AI Router & Proxy for 60+ AI Providers
          Exec=xfce4-terminal --title="9Router AI Server" --command="bash -c 'echo \"=== 9Router Server ===\"; 9router; exec bash'"
          Icon=network-wired
          Path=/home/kali
          Terminal=false
          Categories=Network;Development;
          DESK

          cat <<'DESK' > /home/kali/Desktop/kali-terminal.desktop
          [Desktop Entry]
          Version=1.0
          Type=Application
          Name=Kali Terminal
          Comment=Terminal resmi Kali Linux
          Exec=xfce4-terminal
          Icon=utilities-terminal
          Path=/home/kali
          Terminal=false
          Categories=System;
          DESK

          cat <<'DESK' > /home/kali/Desktop/firefox.desktop
          [Desktop Entry]
          Version=1.0
          Type=Application
          Name=Firefox ESR
          Comment=Web Browser
          Exec=firefox-esr
          Icon=firefox-esr
          Path=/home/kali
          Terminal=false
          Categories=Network;
          DESK

          chmod +x /home/kali/Desktop/*.desktop
          chown -R kali:kali /home/kali

          # 3. Jalankan Display Server TigerVNC di Port 5901 (SecurityTypes None,TLSNone)
          su - kali -c "Xvnc :1 -geometry 1366x768 -depth 24 -rfbport 5901 -SecurityTypes None,TLSNone -pn" > /home/kali/xvnc.log 2>&1 &

          # Tunggu socket display :1 siap
          for i in {1..30}; do
            if [ -S /tmp/.X11-unix/X1 ]; then
              echo "Xvnc display :1 siap!"
              break
            fi
            sleep 0.5
          done

          # 4. Set root background solid agar tidak ada layar hitam
          export DISPLAY=:1
          xsetroot -solid "#1a1b26" 2>/dev/null || true

          # 5. Jalankan Sesi Desktop Resmi Kali Linux (XFCE4 Official Session)
          su - kali -c "
            export DISPLAY=:1
            export XDG_CURRENT_DESKTOP=XFCE
            export DESKTOP_SESSION=xfce
            export XDG_SESSION_TYPE=x11
            export LIBGL_ALWAYS_SOFTWARE=1
            export GDK_BACKEND=x11

            if command -v xfce4-session >/dev/null 2>&1; then
              dbus-run-session xfce4-session
            else
              dbus-run-session bash -c '
                xfsettingsd &
                xfwm4 --compositor=off &
                xfce4-panel &
                xfdesktop &
                wait
              '
            fi
          " > /home/kali/desktop.log 2>&1 &

          # 6. Terapkan tema resmi Kali-Dark dan wallpaper resmi Kali
          (
            sleep 4
            su - kali -c "
              export DISPLAY=:1
              xfconf-query -c xsettings -p /Net/ThemeName -s 'Kali-Dark' --create -t string 2>/dev/null || true
              xfconf-query -c xsettings -p /Net/IconThemeName -s 'Flat-Remix-Blue-Dark' --create -t string 2>/dev/null || true
              xfconf-query -c xfwm4 -p /general/theme -s 'Kali-Dark' --create -t string 2>/dev/null || true
              xfconf-query -c xfwm4 -p /general/use_compositing -s 'false' --create -t bool 2>/dev/null || true
              
              KALI_WP=\$(find /usr/share/backgrounds /usr/share/wallpapers -type f \( -name '*.png' -o -name '*.jpg' \) 2>/dev/null | grep -i kali | head -n 1)
              if [ -n \"\$KALI_WP\" ]; then
                xfconf-query -c xfce4-desktop -p /backdrop/screen0/monitor0/workspace0/last-image -s \"\$KALI_WP\" --create -t string 2>/dev/null || true
                xfconf-query -c xfce4-desktop -p /backdrop/screen0/monitorVNC-0/workspace0/last-image -s \"\$KALI_WP\" --create -t string 2>/dev/null || true
              fi
            " 2>/dev/null || true
          ) &

          sleep 2
          exec tail -f /home/kali/xvnc.log /home/kali/desktop.log
          EOF
          chmod +x entrypoint.sh

          cat <<'EOF' > Dockerfile
          FROM kalilinux/kali-rolling:latest

          ENV DEBIAN_FRONTEND=noninteractive

          # 1. Update repositori resmi Kali Linux & Pasang Desktop Asli Kali (XFCE Official Lengkap) + Tools
          RUN apt-get update && \
              apt-get install -y --no-install-recommends \
                xfce4 \
                xfce4-goodies \
                xfce4-session \
                xfce4-panel \
                xfdesktop4 \
                xfwm4 \
                xfce4-terminal \
                thunar \
                tigervnc-standalone-server \
                dbus-x11 \
                x11-xserver-utils \
                kali-themes \
                kali-menu \
                kali-undercover \
                curl \
                wget \
                sudo \
                fastfetch \
                net-tools \
                iproute2 \
                ca-certificates \
                fonts-dejavu-core \
                fonts-noto-core \
                nmap \
                git \
                nodejs \
                npm \
                firefox-esr && \
              apt-get clean && \
              rm -rf /var/lib/apt/lists/*

          # 2. Pasang OpenCode AI Coding Agent (CLI resmi terbaru)
          RUN curl -fsSL "https://github.com/anomalyco/opencode/releases/latest/download/opencode-linux-x64.tar.gz" | tar -xz -C /usr/local/bin && \
              chmod +x /usr/local/bin/opencode && \
              opencode --version || true

          # 3. Pasang 9Router (AI Router Gateway untuk 60+ Provider) via npm
          RUN npm install -g 9router && \
              which 9router || true

          # 4. Buat user kali resmi dengan hak sudo penuh
          RUN useradd -m -s /bin/bash -u 1000 kali && \
              echo "kali:pochi@333" | chpasswd && \
              echo "kali ALL=(ALL) ALL" >> /etc/sudoers

          COPY entrypoint.sh /entrypoint.sh
          ENTRYPOINT ["/entrypoint.sh"]
          EOF

          docker build -t kali-rdp .
          docker run -d --name kali-desktop --net=host --privileged kali-rdp

          # Tunggu dan pastikan port 5901 VNC aktif
          echo "Memverifikasi port 5901 VNC Kali Linux..."
          for i in {1..30}; do
            if nc -z 127.0.0.1 5901; then
              echo "Port 5901 VNC Kali Linux AKTIF & SIAP!"
              break
            fi
            sleep 1
          done

          # Cek status container
          docker ps
          docker logs kali-desktop || true

      - name: 5. Informasi Akses
        run: |
          echo "=========================================="
          echo "  KALI LINUX RESMI (XFCE ORI) SUDAH AKTIF "
          echo "=========================================="
          echo "IP Tailscale : $TAILSCALE_IP"
          echo "Port         : 3389"
          echo "OS           : Kali Linux (Rolling Release Terbaru)"
          echo "Desktop      : XFCE Official (Original Kali Theme & Dragon Wallpaper)"
          echo "AI Tools     : OpenCode CLI & 9Router Gateway Terpasang"
          echo "User         : kali"
          echo "Password     : pochi@333"
          echo "=========================================="

          while true; do
            echo "[$(date '+%H:%M:%S')] Kali Linux Official XFCE Active..."
            sleep 60
          done
