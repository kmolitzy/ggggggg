name: Kali Linux Official XFCE RDP

on:
  workflow_dispatch:

jobs:
  kali-rdp:
    runs-on: ubuntu-latest
    timeout-minutes: 360

    steps:
      - name: 1. Hubungkan Tailscale di Host
        run: |
          curl -fsSL https://tailscale.com/install.sh | sudo sh
          sudo tailscale up --authkey=${{ secrets.TAILSCALE_AUTH_KEY }} --hostname=kali-runner-${{ github.run_id }}
          
          TS_IP=""
          for i in {1..15}; do
            TS_IP=$(tailscale ip -4 2>/dev/null || true)
            if [ -n "$TS_IP" ]; then break; fi
            sleep 2
          done
          
          if [ -z "$TS_IP" ]; then
            echo "Gagal mendapatkan IP Tailscale" && exit 1
          fi
          echo "TAILSCALE_IP=$TS_IP" >> $GITHUB_ENV
          echo "Tailscale IP: $TS_IP"

      - name: 2. Pasang & Konfigurasi xrdp Gateway
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq xrdp netcat-openbsd

          # Konfigurasi xrdp agar langsung auto-login ke Kali Linux di port 5901 tanpa dialog prompt
          sudo python3 - <<'PY'
          from pathlib import Path
          p = Path('/etc/xrdp/xrdp.ini')
          s = p.read_text()
          s = s.replace('autorun=', 'autorun=KaliLinux')
          s = s.replace('hidelogwindow=no', 'hidelogwindow=yes')
          
          vnc_entry = """[KaliLinux]
          name=KaliLinux
          lib=libvnc.so
          ip=127.0.0.1
          port=5901
          username=na
          password=
          """
          s = s.replace('[Xorg]', vnc_entry + '\n[Xorg]')
          p.write_text(s)
          PY

          sudo systemctl restart xrdp

      - name: 3. Bangun & Jalankan Desktop Kali Linux Murni (XFCE Official ORI + OpenCode + 9Router)
        run: |
          cat <<'EOF' > entrypoint.sh
          #!/bin/bash
          set -e

          mkdir -p /tmp/.X11-unix
          chmod 1777 /tmp/.X11-unix

          # 1. Pastikan direktori Desktop dan konfigurasi XFCE milik user kali
          mkdir -p /home/kali/Desktop
          mkdir -p /home/kali/.config/xfce4/xfconf/xfce-perchannel-xml

          # 2. Buat Shortcut Desktop untuk OpenCode & 9Router
          cat <<'DESK' > /home/kali/Desktop/opencode.desktop
          [Desktop Entry]
          Version=1.0
          Type=Application
          Name=OpenCode AI Agent
          Comment=Terminal-native AI Coding Agent
          Exec=xfce4-terminal --title="OpenCode AI Agent" --command="bash -c 'echo \"=== OpenCode AI Agent ===\"; opencode; exec bash'"
          Icon=utilities-terminal
          Path=/home/kali
          Terminal=false
          Categories=Development;Utility;
          DESK

          cat <<'DESK' > /home/kali/Desktop/9router.desktop
          [Desktop Entry]
          Version=1.0
          Type=Application
          Name=9Router AI Gateway
          Comment=Open-source AI Router & Proxy for 60+ AI Providers
          Exec=xfce4-terminal --title="9Router AI Server" --command="bash -c 'echo \"=== 9Router Server ===\"; 9router; exec bash'"
          Icon=network-wired
          Path=/home/kali
          Terminal=false
          Categories=Network;Development;
          DESK

          cat <<'DESK' > /home/kali/Desktop/kali-terminal.desktop
          [Desktop Entry]
          Version=1.0
          Type=Application
          Name=Kali Terminal
          Comment=Terminal resmi Kali Linux
          Exec=xfce4-terminal
          Icon=utilities-terminal
          Path=/home/kali
          Terminal=false
          Categories=System;
          DESK

          cat <<'DESK' > /home/kali/Desktop/firefox.desktop
          [Desktop Entry]
          Version=1.0
          Type=Application
          Name=Firefox ESR
          Comment=Web Browser
          Exec=firefox-esr
          Icon=firefox-esr
          Path=/home/kali
          Terminal=false
          Categories=Network;
          DESK

          chmod +x /home/kali/Desktop/*.desktop
          chown -R kali:kali /home/kali

          # 3. Jalankan Display Server TigerVNC di Port 5901
          su - kali -c "Xvnc :1 -geometry 1366x768 -depth 24 -rfbport 5901 -SecurityTypes None -pn" > /home/kali/xvnc.log 2>&1 &

          # Tunggu socket display :1 siap
          for i in {1..30}; do
            if [ -S /tmp/.X11-unix/X1 ]; then
              echo "Xvnc display :1 siap!"
              break
            fi
            sleep 0.5
          done

          # 4. Jalankan Sesi Desktop Resmi Kali Linux (XFCE4 Original)
          su - kali -c "
            export DISPLAY=:1
            export XDG_CURRENT_DESKTOP=XFCE
            export DESKTOP_SESSION=xfce
            export XDG_SESSION_TYPE=x11
            dbus-run-session startxfce4
          " > /home/kali/xfce.log 2>&1 &

          # Terapkan tema resmi Kali-Dark dan wallpaper resmi Kali
          (
            sleep 5
            su - kali -c "
              export DISPLAY=:1
              xfconf-query -c xsettings -p /Net/ThemeName -s 'Kali-Dark' 2>/dev/null || true
              xfconf-query -c xsettings -p /Net/IconThemeName -s 'Flat-Remix-Blue-Dark' 2>/dev/null || true
              
              # Set Kali official wallpaper
              KALI_WP=\$(find /usr/share/backgrounds -type f \( -name '*.png' -o -name '*.jpg' \) 2>/dev/null | grep -i kali | head -n 1)
              if [ -n \"\$KALI_WP\" ]; then
                xfconf-query -c xfce4-desktop -p /backdrop/screen0/monitor0/workspace0/last-image -s \"\$KALI_WP\" 2>/dev/null || true
              fi
            " 2>/dev/null || true
          ) &

          sleep 2
          exec tail -f /home/kali/xvnc.log /home/kali/xfce.log
          EOF
          chmod +x entrypoint.sh

          cat <<'EOF' > Dockerfile
          FROM kalilinux/kali-rolling:latest

          ENV DEBIAN_FRONTEND=noninteractive

          # 1. Update repositori resmi Kali Linux & Pasang Desktop Asli Kali (XFCE Official) + Tools
          RUN apt-get update && \
              apt-get install -y --no-install-recommends \
                kali-desktop-xfce \
                xfce4-terminal \
                thunar \
                tigervnc-standalone-server \
                dbus-x11 \
                x11-xserver-utils \
                kali-themes \
                kali-menu \
                kali-undercover \
                curl \
                wget \
                sudo \
                fastfetch \
                net-tools \
                iproute2 \
                ca-certificates \
                fonts-dejavu-core \
                fonts-noto-core \
                nmap \
                git \
                nodejs \
                npm \
                firefox-esr && \
              apt-get clean && \
              rm -rf /var/lib/apt/lists/*

          # 2. Pasang OpenCode AI Coding Agent (CLI resmi terbaru)
          RUN curl -fsSL "https://github.com/anomalyco/opencode/releases/latest/download/opencode-linux-x64.tar.gz" | tar -xz -C /usr/local/bin && \
              chmod +x /usr/local/bin/opencode && \
              opencode --version || true

          # 3. Pasang 9Router (AI Router Gateway untuk 60+ Provider) via npm
          RUN npm install -g 9router && \
              which 9router || true

          # 4. Buat user kali resmi dengan hak sudo penuh
          RUN useradd -m -s /bin/bash -u 1000 kali && \
              echo "kali:pochi@333" | chpasswd && \
              echo "kali ALL=(ALL) ALL" >> /etc/sudoers

          COPY entrypoint.sh /entrypoint.sh
          ENTRYPOINT ["/entrypoint.sh"]
          EOF

          docker build -t kali-rdp .
          docker run -d --name kali-desktop --net=host --privileged kali-rdp

          # Tunggu dan pastikan port 5901 VNC aktif
          echo "Memverifikasi port 5901 VNC Kali Linux..."
          for i in {1..30}; do
            if nc -z 127.0.0.1 5901; then
              echo "Port 5901 VNC Kali Linux AKTIF & SIAP!"
              break
            fi
            sleep 1
          done

          # Cek status container
          docker ps
          docker logs kali-desktop || true

      - name: 4. Informasi Akses
        run: |
          echo "=========================================="
          echo "  KALI LINUX RESMI (XFCE ORI) SUDAH AKTIF "
          echo "=========================================="
          echo "IP Tailscale : $TAILSCALE_IP"
          echo "Port         : 3389"
          echo "OS           : Kali Linux (Rolling Release Terbaru)"
          echo "Desktop      : XFCE Official (Original Kali Theme & Dragon Wallpaper)"
          echo "AI Tools     : OpenCode CLI & 9Router Gateway Terpasang"
          echo "User         : kali"
          echo "Password     : pochi@333"
          echo "=========================================="

          while true; do
            echo "[$(date '+%H:%M:%S')] Kali Linux Official XFCE Active..."
            sleep 60
          done
