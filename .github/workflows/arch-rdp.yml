name: Arch Linux RDP

on:
  workflow_dispatch:

jobs:
  arch-rdp:
    runs-on: ubuntu-latest
    timeout-minutes: 360

    steps:
      - name: 1. Checkout Repository
        uses: actions/checkout@v4

      - name: 2. Hubungkan Tailscale di Host
        run: |
          curl -fsSL https://tailscale.com/install.sh | sudo sh
          sudo tailscale up --authkey=${{ secrets.TAILSCALE_AUTH_KEY }} --hostname=arch-runner-${{ github.run_id }}
          
          TS_IP=""
          for i in {1..15}; do
            TS_IP=$(tailscale ip -4 2>/dev/null || true)
            if [ -n "$TS_IP" ]; then break; fi
            sleep 2
          done
          
          if [ -z "$TS_IP" ]; then
            echo "Gagal mendapatkan IP Tailscale" && exit 1
          fi
          echo "TAILSCALE_IP=$TS_IP" >> $GITHUB_ENV
          echo "Tailscale IP: $TS_IP"

      - name: 3. Pasang & Konfigurasi xrdp Gateway
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq xrdp netcat-openbsd

          # Konfigurasi xrdp auto-login ke Arch VNC di port 5901 tanpa jendela prompt
          sudo python3 - <<'PY'
          from pathlib import Path
          p = Path('/etc/xrdp/xrdp.ini')
          s = p.read_text()
          s = s.replace('autorun=', 'autorun=ArchLinux')
          s = s.replace('hidelogwindow=no', 'hidelogwindow=yes')
          
          vnc_entry = """[ArchLinux]
          name=ArchLinux
          lib=libvnc.so
          ip=127.0.0.1
          port=5901
          username=na
          password=
          """
          s = s.replace('[Xorg]', vnc_entry + '\n[Xorg]')
          p.write_text(s)
          PY

          sudo systemctl restart xrdp

      - name: 4. Bangun & Jalankan Desktop Arch Linux Murni (Tema Dracula + Installer 0X1 di Desktop)
        run: |
          cat <<'EOF' > entrypoint.sh
          #!/bin/bash
          set -e

          mkdir -p /tmp/.X11-unix
          chmod 1777 /tmp/.X11-unix

          # 1. Jalankan Xvnc langsung di port 5901 (display :1) persis seperti versi 6c3b2cd
          su - archuser -c "Xvnc :1 -geometry 1280x720 -depth 24 -rfbport 5901 -SecurityTypes None,TLSNone -pn" > /home/archuser/xvnc.log 2>&1 &

          # Tunggu sampai socket /tmp/.X11-unix/X1 dan port 5901 siap
          for i in {1..30}; do
            if [ -S /tmp/.X11-unix/X1 ]; then
              echo "Xvnc display :1 siap!"
              break
            fi
            sleep 0.5
          done

          # 2. Siapkan file installer 0X1 di Desktop archuser
          mkdir -p /home/archuser/Desktop
          if [ -f /opt/downloads/0X1-1.0.3.apk ]; then
            cp /opt/downloads/0X1-1.0.3.apk /home/archuser/Desktop/0X1-1.0.3.apk
            cp /opt/downloads/Panduan-0X1.html /home/archuser/Desktop/Panduan-0X1.html 2>/dev/null || true
          fi

          # Buat desktop shortcut resmi untuk 0X1 APK
          cat <<'DESK' > /home/archuser/Desktop/0X1-App.desktop
          [Desktop Entry]
          Version=1.0
          Type=Application
          Name=0X1 Android App (APK)
          Comment=File APK Aplikasi 0X1 siap pakai & unduh
          Exec=thunar /home/archuser/Desktop
          Icon=application-x-executable
          Terminal=false
          StartupNotify=true
          DESK
          chmod +x /home/archuser/Desktop/*.desktop 2>/dev/null || true
          chown -R archuser:archuser /home/archuser/Desktop

          # 3. Jalankan Web Server Lokal untuk download APK 0X1 langsung dari HP
          su - archuser -c "python3 -m http.server 8080 --directory /home/archuser/Desktop" > /home/archuser/webserver.log 2>&1 &

          # 4. Jalankan XFCE4 desktop session dengan dbus persis versi 6c3b2cd
          su - archuser -c "DISPLAY=:1 dbus-run-session startxfce4" > /home/archuser/xfce.log 2>&1 &

          # 5. Terapkan Tema Dracula & Ikon Papirus-Dark secara dinamis
          (
            sleep 5
            su - archuser -c "
              export DISPLAY=:1
              xfconf-query -c xsettings -p /Net/ThemeName -s 'Dracula' --create -t string 2>/dev/null || true
              xfconf-query -c xsettings -p /Net/IconThemeName -s 'Papirus-Dark' --create -t string 2>/dev/null || true
              xfconf-query -c xfwm4 -p /general/theme -s 'Dracula' --create -t string 2>/dev/null || true
              xfconf-query -c xfwm4 -p /general/use_compositing -s 'false' --create -t bool 2>/dev/null || true
              
              # Set wallpaper Arch Linux
              if [ -f /usr/share/backgrounds/wallpaper.jpg ]; then
                xfconf-query -c xfce4-desktop -p /backdrop/screen0/monitor0/workspace0/last-image -s /usr/share/backgrounds/wallpaper.jpg --create -t string 2>/dev/null || true
                xfconf-query -c xfce4-desktop -p /backdrop/screen0/monitor0/workspace0/image-style -s 5 --create -t int 2>/dev/null || true
                xfconf-query -c xfce4-desktop -p /backdrop/screen0/monitorVNC-0/workspace0/last-image -s /usr/share/backgrounds/wallpaper.jpg --create -t string 2>/dev/null || true
                xfconf-query -c xfce4-desktop -p /backdrop/screen0/monitorVNC-0/workspace0/image-style -s 5 --create -t int 2>/dev/null || true
              fi
            " 2>/dev/null || true
          ) &

          # Pantau log
          sleep 2
          exec tail -f /home/archuser/xvnc.log /home/archuser/xfce.log
          EOF
          chmod +x entrypoint.sh

          cat <<'EOF' > Dockerfile
          FROM archlinux:latest

          RUN pacman -Syu --noconfirm && \
              pacman -S --noconfirm \
                xfce4 \
                xfce4-goodies \
                xfce4-terminal \
                tigervnc \
                sudo \
                ttf-dejavu \
                ttf-liberation \
                which \
                dbus \
                fastfetch \
                firefox \
                papirus-icon-theme \
                archlinux-wallpaper \
                python \
                curl \
                tar \
                iproute2 && \
              pacman -Scc --noconfirm

          # Unduh & pasang tema modern Dracula GTK & XFWM4
          RUN mkdir -p /usr/share/themes /usr/share/backgrounds && \
              curl -fsSL https://github.com/dracula/gtk/archive/master.tar.gz -o /tmp/dracula.tar.gz && \
              tar -xzf /tmp/dracula.tar.gz -C /usr/share/themes/ && \
              mv /usr/share/themes/gtk-master /usr/share/themes/Dracula && \
              rm -f /tmp/dracula.tar.gz

          # Unduh Wallpaper Arch Modern Dark Minimalist
          RUN curl -fsSL "https://raw.githubusercontent.com/catppuccin/wallpapers/main/minimalistic/arch-nord.png" -o /usr/share/backgrounds/wallpaper.jpg || true && \
              mkdir -p /usr/share/backgrounds/xfce && \
              cp /usr/share/backgrounds/wallpaper.jpg /usr/share/backgrounds/xfce/xfce-stripes.png 2>/dev/null || true && \
              cp /usr/share/backgrounds/wallpaper.jpg /usr/share/backgrounds/xfce/xfce-blue.jpg 2>/dev/null || true

          # Buat user archuser
          RUN useradd -m -s /bin/bash archuser && \
              echo "archuser:pochi@333" | chpasswd && \
              echo "archuser ALL=(ALL) ALL" >> /etc/sudoers

          # Konfigurasi default tema Dracula & Papirus-Dark untuk archuser
          RUN mkdir -p /home/archuser/.config/xfce4/xfconf/xfce-perchannel-xml && \
              echo '<?xml version="1.0" encoding="UTF-8"?><channel name="xsettings" version="1.0"><property name="Net" type="empty"><property name="ThemeName" type="string" value="Dracula"/><property name="IconThemeName" type="string" value="Papirus-Dark"/></property></channel>' > /home/archuser/.config/xfce4/xfconf/xfce-perchannel-xml/xsettings.xml && \
              echo '<?xml version="1.0" encoding="UTF-8"?><channel name="xfwm4" version="1.0"><property name="general" type="empty"><property name="theme" type="string" value="Dracula"/><property name="use_compositing" type="bool" value="false"/></property></channel>' > /home/archuser/.config/xfce4/xfconf/xfce-perchannel-xml/xfwm4.xml && \
              echo 'if [ -t 1 ]; then command -v fastfetch >/dev/null 2>&1 && fastfetch; fi' >> /home/archuser/.bashrc && \
              chown -R archuser:archuser /home/archuser

          # Salin file unduhan 0X1 ke container
          RUN mkdir -p /opt/downloads
          COPY downloads/ /opt/downloads/

          COPY entrypoint.sh /entrypoint.sh
          ENTRYPOINT ["/entrypoint.sh"]
          EOF

          docker build -t arch-rdp .
          docker run -d --name arch-desktop --net=host arch-rdp

          # Verifikasi port 5901 VNC
          echo "Memverifikasi port 5901..."
          for i in {1..20}; do
            if nc -z 127.0.0.1 5901; then
              echo "Port 5901 VNC Arch Linux AKTIF & SIAP!"
              break
            fi
            sleep 1
          done

          # Cek status container & log
          docker ps
          docker logs arch-desktop || true

      - name: 5. Informasi Akses
        run: |
          echo "=========================================="
          echo "      ARCH LINUX RDP SUDAH AKTIF          "
          echo "=========================================="
          echo "IP Tailscale : $TAILSCALE_IP"
          echo "Port RDP     : 3389"
          echo "OS           : Arch Linux (Rolling Release)"
          echo "Desktop      : XFCE4 (Modern Dracula & Papirus)"
          echo "User         : archuser"
          echo "Password     : pochi@333"
          echo "=========================================="
          echo "LINK DOWNLOAD APLIKASI 0X1 LANGSUNG:"
          echo "Buka di browser HP: http://$TAILSCALE_IP:8080"
          echo "Atau buka file di Desktop: 0X1-1.0.3.apk"
          echo "=========================================="

          while true; do
            echo "[$(date '+%H:%M:%S')] Arch Linux Active at IP $TAILSCALE_IP..."
            sleep 60
          done
