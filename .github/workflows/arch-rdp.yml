name: Arch Linux RDP

on:
  workflow_dispatch:

jobs:
  arch-rdp:
    runs-on: ubuntu-latest
    timeout-minutes: 360

    steps:
      - name: 1. Pasang & Hubungkan Tailscale di Host
        run: |
          curl -fsSL https://tailscale.com/install.sh | sudo sh
          sudo tailscale up --authkey=${{ secrets.TAILSCALE_AUTH_KEY }} --hostname=arch-runner-${{ github.run_id }}
          
          TS_IP=""
          for i in {1..15}; do
            TS_IP=$(tailscale ip -4 2>/dev/null || true)
            if [ -n "$TS_IP" ]; then break; fi
            sleep 2
          done
          
          if [ -z "$TS_IP" ]; then
            echo "Gagal mendapatkan IP Tailscale" && exit 1
          fi
          echo "TAILSCALE_IP=$TS_IP" >> $GITHUB_ENV
          echo "Tailscale IP: $TS_IP"

      - name: 2. Siapkan xrdp Gateway di Host
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq xrdp
          sudo sed -i 's/port=3389/port=3389/g' /etc/xrdp/xrdp.ini
          sudo systemctl enable --now xrdp

      - name: 3. Bangun & Jalankan Arch Linux GUI Container
        run: |
          # Buat container Arch Linux resmi dengan XFCE4, TigerVNC, terminal, & fastfetch
          cat <<'EOF' > Dockerfile
          FROM archlinux:latest
          
          RUN pacman -Syu --noconfirm && \
              pacman -S --noconfirm \
                xfce4 \
                xfce4-terminal \
                tigervnc \
                sudo \
                ttf-dejavu \
                ttf-liberation \
                which \
                dbus \
                fastfetch \
                firefox

          # Buat user archuser
          RUN useradd -m -s /bin/bash archuser && \
              echo "archuser:pochi@333" | chpasswd && \
              echo "archuser ALL=(ALL) ALL" >> /etc/sudoers

          USER archuser
          WORKDIR /home/archuser

          # Konfigurasi desktop XFCE di VNC
          RUN mkdir -p /home/archuser/.vnc && \
              echo "pochi@333" | vncpasswd -f > /home/archuser/.vnc/passwd && \
              chmod 600 /home/archuser/.vnc/passwd && \
              echo '#!/bin/sh' > /home/archuser/.vnc/xstartup && \
              echo 'unset SESSION_MANAGER' >> /home/archuser/.vnc/xstartup && \
              echo 'unset DBUS_SESSION_BUS_ADDRESS' >> /home/archuser/.vnc/xstartup && \
              echo 'exec startxfce4' >> /home/archuser/.vnc/xstartup && \
              chmod +x /home/archuser/.vnc/xstartup

          CMD ["/bin/sh", "-c", "vncserver :1 -geometry 1280x720 -depth 24 && tail -f /home/archuser/.vnc/*.log"]
          EOF

          docker build -t arch-rdp .
          docker run -d --name arch-desktop --net=host arch-rdp
          sleep 5

          # Hubungkan port 3389 xrdp langsung ke desktop Arch
          sudo python3 - <<'PY'
          from pathlib import Path
          p = Path('/etc/xrdp/xrdp.ini')
          s = p.read_text()
          vnc_entry = """[Xvnc]
          name=ArchLinux
          lib=libvnc.so
          username=na
          password=pochi@333
          ip=127.0.0.1
          port=5901
          """
          s = s.replace('[Xorg]', vnc_entry + '\n[Xorg]')
          p.write_text(s)
          PY
          
          sudo systemctl restart xrdp

      - name: 4. Info Akses RDP Arch Linux
        run: |
          echo "=========================================="
          echo "      ARCH LINUX RDP BERHASIL AKTIF       "
          echo "=========================================="
          echo "IP Tailscale : $TAILSCALE_IP"
          echo "Port         : 3389"
          echo "Username     : archuser"
          echo "Password     : pochi@333"
          echo "OS           : Arch Linux (Rolling Release)"
          echo "Desktop      : XFCE4"
          echo "=========================================="

          while true; do
            echo "[$(date '+%H:%M:%S')] Arch Linux RDP Active at IP $TAILSCALE_IP..."
            sleep 60
          done
